[project]
name = "horae-plugin-livesync"
version = "0.1.0"
description = "Horae plugin: keep an Obsidian vault as plain files on the server with Self-hosted LiveSync (E2EE CouchDB)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "dulwich>=1",
    "horae-sdk>=0.9,<0.10",
    "pyyaml>=6",
]

[project.scripts]
horae-livesync = "horae_livesync.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/horae_livesync"]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pre-commit>=4.7",
    "pytest>=9.1",
    "pytest-cov>=7",
    "ruff>=0.17",
    "types-pyyaml>=6",
]

[tool.uv]
required-version = ">=0.13"
exclude-newer = "7 days"
# Our own SDK, released from the core repository by the maintainers: no cooldown.
exclude-newer-package = { horae-sdk = false }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S108"]

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.12"
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers -m 'not integration'"
markers = [
    "integration: needs Docker, a CouchDB container and the sidecar image (`uv run pytest -m integration`)",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["horae_livesync"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
