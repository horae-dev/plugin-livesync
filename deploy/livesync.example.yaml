# livesync.yaml: the LiveSync sidecar's configuration (horae_livesync.config). Keep it next to
# horae.yaml in the instance repository: it holds no secret value, only secret names.
schema_version: 1
couchdb:
  # The CouchDB of your Self-hosted LiveSync (PLAN §7: the `vault-sync` service). https to any
  # host; plain http only to a private address or a service name on the same Docker network.
  url: https://couchdb.example.org
  database: obsidian
  username: horae
  password_secret: LIVESYNC_COUCHDB_PASSWORD
e2ee:
  # The same passphrase as the Obsidian clients (E2EE is always on: there is no switch).
  passphrase_secret: LIVESYNC_E2EE_PASSPHRASE
  # Must match the clients ("Obfuscate paths"). PLAN §7 turns it on.
  path_obfuscation: true
# live: the CouchDB _changes feed (near real time). poll: every poll_interval_s seconds.
sync: { mode: live }
health: { probe_interval_s: 30, request_timeout_s: 10 }
# Other LiveSync settings, to match your Obsidian clients where the CLI's defaults differ
# (names and types as in the CLI's `init-settings`; credentials and remotes are refused).
# For example a vault created before LiveSync 1.0.38 keeps the legacy path identity:
#   pathNormalizationVersion: 0
settings: {}
# As in horae.yaml (schemas decision 25): a secret is the file <dir>/<NAME> unless `refs` says
# otherwise, e.g. LIVESYNC_COUCHDB_PASSWORD: { env: LIVESYNC_COUCHDB_PASSWORD } on Coolify.
secrets:
  dir: /run/secrets
  refs: {}
