# The LiveSync sidecar next to Horae: an override for the core's deploy/compose stack.
#
#   docker compose -f docker-compose.yaml -f compose.livesync.yaml up -d
#
# It adds the `livesync` service (the official Self-hosted LiveSync CLI in daemon mode,
# supervised by horae-livesync) and gives `horae` the vault folder it mirrors (/vault) and its
# status (/livesync-status, read-only). Then, in horae.lock: plugin-obsidian's paths.write is
# /vault and plugin-livesync's paths.read is /livesync-status. README "Deploying".
#
# Needed in .env: HORAE_LIVESYNC_REF (a commit of plugin-livesync: no default, so an update
# is always a deliberate pin), HORAE_LIVESYNC_CONFIG (the livesync.yaml file),
# HORAE_SECRETS_DIR (already used by the core: the two secret files below live there,
# readable by uid 10001). Use a dedicated CouchDB user for the sidecar (README, "Deploying").
#
# KNOWN LIMITATION, deletions while the sidecar is down (README): the CLI rescans the vault
# folder against its local database on every start (each container or CLI restart). A file
# that was there at the previous start and is deleted while the sidecar is down IS deleted in
# CouchDB, on every device, when it starts again; a file created after the previous start and
# deleted while it is down is RESTORED from CouchDB. Delete notes through Obsidian, or in the
# folder only while the sidecar is up (`livesync.status` reports `live`).
services:
  livesync:
    # No published image yet: built from this repository at the commit you pin (README).
    image: "horae-livesync:${HORAE_LIVESYNC_REF:?set HORAE_LIVESYNC_REF to a plugin-livesync commit}"
    build:
      context: "https://github.com/horae-dev/plugin-livesync.git#${HORAE_LIVESYNC_REF:?set HORAE_LIVESYNC_REF to a plugin-livesync commit}"
    platform: linux/amd64
    restart: unless-stopped
    # An init process as PID 1: it reaps whatever the Node.js CLI leaves behind and forwards
    # SIGTERM to horae-livesync.
    init: true
    user: "10001:10001"
    read_only: true
    # The rendered CLI settings (credentials, passphrase) live here, 0600: in memory for the
    # container's lifetime (tmpfs pages can still be swapped out; README, "Configuration").
    tmpfs:
      - "/tmp:size=64m,noexec,nosuid,nodev"
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    stop_grace_period: 30s
    # The image's HEALTHCHECK allows 5 min for the first fetch. For a large vault, raise it:
    #   healthcheck: { start_period: 1h }
    environment:
      TZ: "${TZ:-UTC}"
    volumes:
      - "${HORAE_LIVESYNC_CONFIG:?set HORAE_LIVESYNC_CONFIG to your livesync.yaml}:/config/livesync.yaml:ro"
      - livesync-db:/livesync
      - livesync-vault:/vault
      - livesync-status:/status
      # The nightly git snapshots of the vault (snapshot: in livesync.yaml, README "Snapshots"):
      # a bare repository on its own volume, never inside the vault. Back this volume up too.
      - livesync-snapshots:/snapshots
    # Only the two secrets it needs, at /run/secrets/<NAME> (never the whole secrets dir).
    secrets:
      - LIVESYNC_COUCHDB_PASSWORD
      - LIVESYNC_E2EE_PASSPHRASE

  horae:
    # The sidecar first, so that the new volumes are created with its owner (10001, 0700).
    depends_on:
      livesync:
        condition: service_started
    volumes:
      - livesync-vault:/vault
      - livesync-status:/livesync-status:ro

secrets:
  LIVESYNC_COUCHDB_PASSWORD:
    file: "${HORAE_SECRETS_DIR:?}/LIVESYNC_COUCHDB_PASSWORD"
  LIVESYNC_E2EE_PASSPHRASE:
    file: "${HORAE_SECRETS_DIR:?}/LIVESYNC_E2EE_PASSPHRASE"

volumes:
  # The CLI's local PouchDB: keep it (a lost one means a full fetch from CouchDB).
  livesync-db:
  # The vault as plain files: in the backup set (PLAN §7); its history is in livesync-snapshots.
  livesync-vault:
  livesync-status:
  livesync-snapshots:
