name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_LOCKED: "1"
  UV_PYTHON_PREFERENCE: only-managed
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: 0.13.6

jobs:
  lock:
    name: Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          cache-python: true
      - run: uv lock --check

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          cache-python: true
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check

  types:
    name: Types (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          cache-python: true
      - run: uv sync
      - run: uv run mypy

  test:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          cache-python: true
      - run: uv sync
      # The unit tests run the supervisor against a fake CLI (tests/fake_cli.py) replaying a log
      # recorded from the pinned CLI (tests/fixtures); the integration tests are deselected
      # here (job Integration). The 85% gate comes from [tool.coverage.report] in pyproject.toml.
      - run: uv run pytest --cov --cov-report=term-missing

  integration:
    name: Integration (sidecar image + CouchDB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          cache-python: true
      - run: uv sync
      # The image as it ships (Dockerfile: the official LiveSync CLI pinned by digest); nothing
      # is pushed.
      - name: Build the sidecar image
        run: docker build --platform linux/amd64 -t horae-livesync:test .
      # The tests start a CouchDB container (pinned by digest), the sidecar and a second
      # LiveSync client on a private Docker network, all with synthetic credentials, and cover
      # restarts (deletions while down), a CouchDB outage and a wrong password.
      - name: Two-way sync against a real CouchDB
        env:
          HORAE_LIVESYNC_IMAGE: horae-livesync:test
        run: uv run pytest -m integration -v

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # renovate: datasource=github-releases depName=gitleaks/gitleaks
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz from the upstream checksums file
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
      - name: Scan full git history
        run: |
          "${RUNNER_TEMP}/gitleaks/gitleaks" git --redact --verbose \
            --log-opts="--full-history HEAD" .

  ci-ok:
    name: CI OK
    if: ${{ always() }}
    needs: [lock, lint, types, test, integration, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # Every job must succeed.
      - name: Require all jobs to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "${NEEDS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "${NEEDS}" | jq -e 'all(to_entries[]; .value.result == "success")' > /dev/null

  # The image, published only from main once every job above passed (CI OK, which needs the
  # Integration job: this Dockerfile against a real CouchDB). It is built again here, smoke
  # tested, pushed by digest with an SBOM and provenance, signed keyless with cosign, and only
  # then tagged `sha-<short>`. A `v*` tag adds the release tags to that digest (image.yml).
  publish:
    name: Image (publish, sign, verify)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [ci-ok]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read # checkout
      packages: write # push to ghcr.io/horae-dev/horae-livesync
      id-token: write # keyless cosign signing (sigstore OIDC)
    env:
      IMAGE: ghcr.io/horae-dev/horae-livesync
      # The signing identity; keep in sync with image.yml and README "Deploying".
      SIGNER: https://github.com/horae-dev/plugin-livesync/.github/workflows/ci.yml@refs/heads/main
      # renovate: datasource=github-releases depName=sigstore/cosign
      COSIGN_VERSION: 3.1.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v${{ env.COSIGN_VERSION }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,format=short,prefix=sha-,enable={{is_default_branch}}
      # Built, loaded and smoke-tested before anything is pushed. The push reuses these layers
      # from the builder's cache, and the step after it checks that the pushed filesystem is the
      # tested one. Only the revision label is added: the Dockerfile's own labels (licences)
      # stay as they are.
      - name: Build linux/amd64 (loaded, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: horae-livesync:candidate
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=image-linux-amd64
          cache-to: type=gha,scope=image-linux-amd64,mode=max
      - name: Smoke test
        run: scripts/smoke-image.sh horae-livesync:candidate
      - name: Push by digest, untagged (SBOM and provenance attached)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          labels: org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-linux-amd64
          sbom: true
          provenance: mode=max
      # imagetools prints a single-platform index's config and SBOM as one object (a map by
      # platform when there are several): `one` accepts both.
      - name: The pushed filesystem is the smoke-tested one
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          one='if type == "object" and has("linux/amd64") then .["linux/amd64"] else . end'
          pushed="$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{ json .Image }}' | jq -c "${one}")"
          tested="$(docker image inspect horae-livesync:candidate --format '{{ json .RootFS.Layers }}' | jq -c .)"
          published="$(jq -c '.rootfs.diff_ids' <<< "${pushed}")"
          if [ "${tested}" != "${published}" ]; then
            echo "the pushed layers differ from the smoke-tested image" >&2
            exit 1
          fi
          jq -e --arg sha "${GITHUB_SHA}" \
            '.architecture == "amd64" and .config.Labels["org.opencontainers.image.revision"] == $sha' \
            <<< "${pushed}" > /dev/null
          echo "${IMAGE}@${DIGEST}: same layers as the smoke-tested image, revision ${GITHUB_SHA}"
      - name: Verify the SBOM
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          one='if type == "object" and has("linux/amd64") then .["linux/amd64"] else . end'
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{ json .SBOM }}' \
            | jq -e "${one} | (.SPDX.packages | length) > 0" > /dev/null
          echo "SPDX SBOM with packages for linux/amd64"
      - name: Sign the digest (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Verify the signature
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "${SIGNER}" \
            --certificate-github-workflow-repository horae-dev/plugin-livesync \
            --certificate-github-workflow-trigger push \
            --certificate-github-workflow-sha "${GITHUB_SHA}" \
            "${IMAGE}@${DIGEST}" > /dev/null
          echo "signature verified for ${IMAGE}@${DIGEST}"
      # Tags are applied last, so a tag never points at an untested or unsigned digest.
      - name: Tag the signed digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            if [ -n "${tag}" ]; then args+=(-t "${tag}"); fi
          done <<< "${TAGS}"
          if [ "${#args[@]}" -eq 0 ]; then echo "no tags to apply" >&2; exit 1; fi
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
          while IFS= read -r tag; do
            if [ -z "${tag}" ]; then continue; fi
            got="$(docker buildx imagetools inspect "${tag}" --format '{{ json .Manifest }}' | jq -r .digest)"
            if [ "${got}" != "${DIGEST}" ]; then
              echo "${tag} points at ${got}, not ${DIGEST}" >&2
              exit 1
            fi
            echo "${tag} -> ${DIGEST}"
          done <<< "${TAGS}"
